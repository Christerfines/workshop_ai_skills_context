id: automated-code-review-standards-002
name: Report a deterministic clock violation
description: Verify that the reviewer identifies an NB001 violation with source-grounded evidence.
tags:
  - positive
  - standards
  - static-candidate
inputs:
  prompt: |
    Use automated-code-review on clock-violation.cs. Treat the file as a changed
    web-project source file. Report only evidence-backed findings in the required
    JSON shape; do not edit the file.
  files:
    - path: clock-violation.cs
expected:
  should_trigger: true
graders:
  - type: text
    name: nb001-finding
    config:
      regex_match:
        - '(?i)NB001'
        - '(?i)DateTime\.UtcNow|DemoClock'
        - '(?i)clock-violation\.cs'
        - '(?i)evidence|finding'
        - '(?i)no files changed|read-only'

